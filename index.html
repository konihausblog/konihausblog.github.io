<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Konihaus Insights</title>
</head>
<body>
  <script>
    (function () {
      function getLangFromCookie() {
        const match = document.cookie.match(/(?:^|; )konihaus-language=([^;]*)/);
        return match ? decodeURIComponent(match[1]) : null;
      }
      function getBrowserLang() {
        const langs = navigator.languages || [navigator.language || 'en'];
        for (const l of langs) {
          if (l.toLowerCase().startsWith('de')) return 'de';
        }
        return 'en';
      }
      const lang = getLangFromCookie() || getBrowserLang();
      const target = lang === 'de'
        ? 'https://blog.konihaus.ch/de/insights/'
        : 'https://blog.konihaus.ch/en/insights/';
      window.location.replace(target);
    })();
  </script>
  <noscript>
    <p>
      <a href="https://blog.konihaus.ch/en/insights/">Continue in English</a> ·
      <a href="https://blog.konihaus.ch/de/insights/">Weiter auf Deutsch</a>
    </p>
  </noscript>
</body>
</html>
